{% extends 'tasks/base.html' %}
{% load static %}

{% block title %}صفحه یافت نشد | 404{% endblock %}

{% block content %}
<div style="min-height: 75vh; display: flex; align-items: center; justify-content: center;">
    <div class="card text-center" style="max-width: 480px; width: 100%; padding: 40px 32px;">
        <div style="background: var(--accent); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px auto;">
            <svg class="icon" style="width: 40px; height: 40px; stroke: #6C4200;" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        </div>
        
        <h1 style="font-size: 3.5rem; margin-bottom: 8px; color: var(--text-primary);">404</h1>
        <h3 style="margin-bottom: 12px;">صفحه مورد نظر پیدا نشد</h3>
        <p style="margin-bottom: 28px; font-size: 0.95rem;">
            صفحه‌ای که به دنبال آن هستید وجود ندارد یا تغییر مسیر داده شده است.
        </p>
        
        <a href="{% url 'task_list' %}" class="btn btn-primary" style="width: 100%;">
            بازگشت به لیست تسک‌ها
        </a>
    </div>
</div>
{% endblock %}
