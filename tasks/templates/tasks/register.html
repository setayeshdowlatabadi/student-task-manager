{% extends 'tasks/base.html' %}

{% block title %}ثبت‌نام{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4">
            <h4 class="fw-bold text-center mb-4 text-success"><i class="fa-solid fa-user-plus me-2"></i>ثبت‌نام کاربر جدید</h4>
            <form method="POST">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                    {% endif %}
                </div>
                {% endfor %}
                <button type="submit" class="btn btn-success w-100 py-2 mb-3">ایجاد حساب</button>
            </form>
            <div class="text-center text-muted small">
                قبلاً ثبت‌نام کرده‌اید؟ <a href="{% url 'login' %}" class="text-decoration-none">وارد شوید</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
