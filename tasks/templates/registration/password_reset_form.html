{% extends 'tasks/base.html' %}
{% block title %}رمز عبور جدید{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 shadow-sm">
            <h4 class="fw-bold mb-3 text-center text-primary">تغییر رمز عبور</h4>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100 mt-3">تغییر رمز عبور</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
