{% extends 'tasks/base.html' %}
{% block title %}فراموشی رمز عبور{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 shadow-sm">
            <h4 class="fw-bold mb-3 text-center text-primary">بازنشانی رمز عبور</h4>
            <p class="text-muted small text-center mb-4">ایمیل خود را وارد کنید تا لینک بازیابی برای شما ارسال شود.</p>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">آدرس ایمیل</label>
                    <input type="email" name="email" class="form-control" placeholder="example@gmail.com" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">ارسال لینک بازیابی</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
