{% extends 'tasks/base.html' %}

{% block content %}
<div class="row justify-content-center text-center">
    <div class="col-md-6">
        <div class="card p-5 shadow-sm">
            <i class="fa-solid fa-paper-plane fa-3x text-success mb-3"></i>
            <h4 class="fw-bold text-success mb-3">ایمیل بازیابی ارسال شد</h4>
            <p class="text-muted">دستورالعمل تنظیم رمز عبور جدید به ایمیل شما ارسال شد. (اگر از سیستم توسعه استفاده می‌کنید، لینک را در ترمینال VS Code چک کنید).</p>
            <a href="{% url 'login' %}" class="btn btn-outline-primary mt-3">بازگشت به ورود</a>
        </div>
    </div>
